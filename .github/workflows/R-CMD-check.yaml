name: R-CMD-check

on:
  # Manual only while dnsr is private. The default token is scoped to this
  # repository and cannot resolve the dependency, so an automatic run would
  # fail before reaching any check -- a red badge that says nothing about the
  # code. A manual run still needs a DNSR_PAT secret with read access to dnsr.
  #
  # When dnsr is published: delete the DNSR_PAT secret if it exists, and
  # uncomment the two triggers below. Nothing else needs to change.
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # The Windows leg is the one that earns its keep: the parLapply
          # branches in calculate_credit_vectors() and project_cashflows() are
          # only reached off Unix, so they never run on a developer machine.
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      # dnsr is a private repository for now, and the default token is scoped
      # to this one, so it cannot resolve the dependency. DNSR_PAT is a
      # personal access token with read access to it. Once dnsr is public the
      # secret can be deleted and the fallback below takes over unchanged.
      GITHUB_PAT: ${{ secrets.DNSR_PAT || secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
